<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Saburi/play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="admin-wrap">
  <h1>
    <svg class="brand-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M 175 150 L 110 256 L 175 362" fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 337 150 L 402 256 L 337 362" fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 222 188 L 222 324 L 328 256 Z" fill="currentColor"/>
    </svg>
    Adicionar vídeo
  </h1>
  <p class="hint">Cole o link do YouTube, preencha o resto e clique em salvar. O vídeo aparece no site na hora.</p>

  <form id="video-form">
    <div class="field">
      <label for="title">Título</label>
      <input type="text" id="title" required placeholder="Ex: Como eu construí o SSAP">
    </div>

    <div class="field">
      <label for="stream-url">Link do vídeo (.m3u8 do seu servidor)</label>
      <input type="text" id="stream-url" required placeholder="https://seu-link.trycloudflare.com/videos/teste.m3u8">
    </div>

    <div class="field">
      <label for="thumbnail-file">Thumbnail (opcional)</label>
      <input type="file" id="thumbnail-file" accept="image/*">
    </div>

    <div class="field">
      <label for="category">Categoria</label>
      <input type="text" id="category" required placeholder="Ex: Desenvolvimento, Qualidade, Bastidores">
    </div>

    <div class="field">
      <label for="description">Descrição (opcional)</label>
      <input type="text" id="description" placeholder="Uma linha sobre o vídeo">
    </div>

    <div class="field">
      <label for="published-at">Data de publicação</label>
      <input type="date" id="published-at" required>
    </div>

    <button type="submit" class="submit-btn" id="submit-btn">Salvar vídeo</button>
    <p class="status-msg" id="status-msg"></p>
  </form>

  <div class="admin-list">
    <h2>Vídeos cadastrados</h2>
    <div id="video-list">Carregando…</div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
