<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca — Saburi/play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="biblioteca.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand">
    <svg class="brand-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M 175 150 L 110 256 L 175 362" fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 337 150 L 402 256 L 337 362" fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 222 188 L 222 324 L 328 256 Z" fill="currentColor"/>
    </svg>
    saburi<span class="brand-badge">v.play</span><span class="brand-star" aria-hidden="true">★</span>
    <a href="https://videos.ssgf.com.br/status.html" class="status-link" target="_blank" rel="noopener" aria-label="Status do servidor"><span class="status-dot" id="status-dot"></span></a>
  </a>
  <nav class="site-nav">
    <a href="index.html" class="tab-link">Vídeos</a>
    <a href="biblioteca.html" class="tab-link active">Biblioteca</a>
  </nav>
</header>

<main>

  <section class="mural-intro">
    <p class="eyebrow-plain">Biblioteca</p>
    <h1>Referências e leituras</h1>
    <p class="mural-desc">Um mural com quem influenciou como eu penso sobre qualidade, sistemas e produto — e a estante do que já li e do que ainda quero ler.</p>
  </section>

  <section class="mural" id="mural">
    <h2>Mural de referências</h2>
    <div class="mural-grid" id="mural-grid">
      <p class="loading-msg">Carregando…</p>
    </div>
  </section>

  <section class="estante" id="estante">
    <div class="section-head">
      <h2>Estante</h2>
      <div class="filters" id="book-filters">
        <button class="filter active" data-filter="todos">Todos</button>
        <button class="filter" data-filter="lido">Já li</button>
        <button class="filter" data-filter="quero_ler">Quero ler</button>
      </div>
    </div>
    <div class="book-grid" id="book-grid">
      <p class="loading-msg">Carregando…</p>
    </div>
  </section>

</main>

<div class="modal-overlay" id="figure-modal" hidden>
  <div class="modal-card">
    <button class="modal-close" id="modal-close" aria-label="Fechar">✕</button>
    <div class="modal-photo-frame" id="modal-photo-frame"></div>
    <p class="modal-name" id="modal-name"></p>
    <p class="modal-role" id="modal-role"></p>
    <label for="modal-notes" class="modal-notes-label">Suas anotações</label>
    <textarea id="modal-notes" rows="8" placeholder="O que você acha das ideias dessa pessoa, o que te influenciou, o que discorda..."></textarea>
    <div class="modal-actions">
      <span class="modal-status" id="modal-status"></span>
      <button class="submit-btn" id="modal-save">Salvar anotação</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="footer-brand">
    <svg class="brand-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M 175 150 L 110 256 L 175 362" fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 337 150 L 402 256 L 337 362" fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 222 188 L 222 324 L 328 256 Z" fill="currentColor"/>
    </svg>
    saburi<span class="brand-badge">v.play</span><span class="brand-star" aria-hidden="true">★</span>
  </div>
  <div class="footer-links">
    <a href="https://ssgf.com.br" target="_blank" rel="noopener">ssgf.com.br</a>
    <a href="index.html#contato">contato</a>
  </div>
</footer>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="header-status.js"></script>
<script src="biblioteca.js"></script>
</body>
</html>
